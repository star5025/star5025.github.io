media:
  input: assets/images
  output: /assets/images
content:
  - name: posts
    label: 文章（开发 / 日常 / 旅行）
    type: collection
    path: _posts
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{primary}.md"
    subfolders: false
    view:
      primary: title
      sort: date
      order: desc
    fields:
      - name: layout
        type: string
        default: post
        hidden: true
      - name: title
        label: 标题
        type: string
        required: true
      - name: date
        label: 日期
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: section
        label: 栏目
        type: select
        default: daily
        required: true
        options:
          values:
            - label: 开发
              name: development
            - label: 日常
              name: daily
            - label: 旅行
              name: travel
      - name: description
        label: 简介（可选）
        type: text
      - name: published
        label: 发布到网站
        type: boolean
        default: false
      - name: tags
        label: 标签
        type: string
        list: true
      - name: body
        label: 正文
        type: rich-text
  - name: about
    label: 关于
    type: file
    path: about.md
    fields:
      - name: layout
        type: string
        default: page
        hidden: true
      - name: title
        type: string
      - name: permalink
        type: string
        hidden: true
      - name: page_type
        type: string
        hidden: true
      - name: nav_key
        type: string
        hidden: true
      - name: body
        label: 正文
        type: rich-text
