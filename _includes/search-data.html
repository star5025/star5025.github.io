{% capture json_lt %}\u003c{% endcapture %}<script type="application/json" id="search-data">[
{% for post in site.posts %}{"title":{{ post.title | jsonify | replace: '<', json_lt }},"url":{{ post.url | relative_url | jsonify | replace: '<', json_lt }},"summary":{{ post.description | default: post.excerpt | strip_html | normalize_whitespace | truncate: 180 | jsonify | replace: '<', json_lt }},"category":{{ post.section | default: 'daily' | jsonify | replace: '<', json_lt }},"date":{{ post.date | date: '%Y-%m-%d' | jsonify }}}{% unless forloop.last %},{% endunless %}
{% endfor %}]</script>
