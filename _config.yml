title: "1star"
author: "1star"
description: "开发、生活，以及路上的片段。"
url: "https://star5025.github.io"
baseurl: ""
lang: zh-CN
timezone: Asia/Shanghai
markdown: kramdown
highlighter: rouge
permalink: /posts/:year/:month/:day/:title/
future: false
show_drafts: false
plugins:
  - jekyll-feed
  - jekyll-seo-tag
collections:
  albums:
    output: true
    permalink: /gallery/:name/
defaults:
  - scope:
      path: ""
      type: albums
    values:
      layout: album
      page_type: album
      nav_key: gallery
      published: false
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      section: daily
exclude:
  - README.md
  - .pages.yml
  - Gemfile
  - Gemfile.lock
  - assets/main.scss
